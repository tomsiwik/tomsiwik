<svg width="110" height="40" viewBox="0 0 110 40" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <style>
    :root { --logo-primary: oklch(0.52 0.21 12.29); }
    .r { fill: var(--logo-primary); }
    .w { fill: #fff; }
    .b { fill: #00c7f6; }
    @media (prefers-color-scheme: light) {
      .r { fill: #d4d4d4; }
      .w { fill: oklch(from var(--logo-primary) calc(l + 0.12) c h); }
      .b { fill: #fff; }
    }
  </style>

  <g class="r">
    <rect x="0" y="0" width="10" height="10" />
    <rect x="10" y="0" width="10" height="10" />
    <rect x="20" y="0" width="10" height="10" />
    <rect x="40" y="0" width="10" height="10" />
    <rect x="50" y="0" width="10" height="10" />
    <rect x="60" y="0" width="10" height="10" />
    <rect x="80" y="0" width="10" height="10" />
    <rect x="100" y="0" width="10" height="10" />
    <rect x="10" y="10" width="10" height="10" />
    <rect x="40" y="10" width="10" height="10" />
    <rect x="60" y="10" width="10" height="10" />
    <rect x="90" y="10" width="10" height="10" />
    <rect x="80" y="20" width="10" height="10" />
    <rect x="100" y="20" width="10" height="10" />
  </g>

  <g class="w">
    <rect x="0" y="10" width="10" height="10" />
    <rect x="20" y="10" width="10" height="10" />
    <rect x="50" y="10" width="10" height="10" />
    <rect x="80" y="10" width="10" height="10" />
    <rect x="100" y="10" width="10" height="10" />
    <rect x="0" y="20" width="10" height="10" />
    <rect x="10" y="20" width="10" height="10" />
    <rect x="20" y="20" width="10" height="10" />
    <rect x="40" y="20" width="10" height="10" />
    <rect x="50" y="20" width="10" height="10" />
    <rect x="60" y="20" width="10" height="10" />
    <rect x="90" y="20" width="10" height="10" />
    <rect x="0" y="30" width="10" height="10" />
    <rect x="20" y="30" width="10" height="10" />
    <rect x="40" y="30" width="10" height="10" />
    <rect x="60" y="30" width="10" height="10" />
    <rect x="80" y="30" width="10" height="10" />
    <rect x="100" y="30" width="10" height="10" />
  </g>

  <g class="b">
    <rect x="10" y="30" width="10" height="10" />
    <rect x="50" y="30" width="10" height="10" />
    <rect x="90" y="30" width="10" height="10" />
  </g>
</svg>
