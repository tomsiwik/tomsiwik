name: Update Projects Grid

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image converters
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick
          echo "magick: $(command -v magick || echo MISSING)"
          echo "convert: $(command -v convert || echo MISSING)"
          echo "identify: $(command -v identify || echo MISSING)"
          dpkg -l | grep -i imagemagick || echo "no imagemagick packages"
          curl -sfL https://tomhacks.com/favicon.ico -o /tmp/t.ico
          echo "--- file: $(file -b --mime-type /tmp/t.ico) size: $(stat -c%s /tmp/t.ico)"
          echo "--- identify -format raw output:"
          identify -format '%[fx:w*h] %s\n' /tmp/t.ico; echo "exit=$?"
          echo "--- plain identify:"
          identify /tmp/t.ico; echo "exit=$?"

      - name: Generate projects SVG
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: bash gen-projects-grid.sh > assets/projects.svg

      - name: Commit and push if changed
        run: |
          git diff --quiet assets/projects.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects.svg
          git commit -m "chore: update projects grid"
          git push
